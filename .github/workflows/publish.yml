name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
      - run: uv venv && uv pip install -e ".[dev]"
      - run: .venv/bin/pytest -q tests/test_review_code.py tests/test_review_plan.py tests/test_cli.py tests/test_common.py

  publish:
    needs: test-core
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
      - run: uv venv && uv pip install build
      - run: .venv/bin/python -m build
      # v1.14.2 — older pins bundle a twine that rejects Metadata-Version 2.5,
      # which current hatchling emits (v0.1.17 publish failed on exactly this).
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
