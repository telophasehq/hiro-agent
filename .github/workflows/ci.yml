name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  core-review-gate:
    name: Core Review Gate (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0
      - run: uv venv && uv pip install -e ".[dev]"
      - run: .venv/bin/pytest -q tests/test_review_code.py tests/test_review_plan.py tests/test_cli.py tests/test_common.py
