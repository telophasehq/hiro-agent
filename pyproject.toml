[project]
name = "hiro-agent"
version = "0.1.17"
description = "AI security review agent for code, plans, and infrastructure"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = [
    # 0.2.x bundles a pinned Claude CLI. 0.1.x resolves the SYSTEM claude
    # binary, so a routine claude auto-update breaks every review with
    # "stopped without producing a verdict (success)" — 0.1.65 + claude
    # 2.1.2xx sends the legacy thinking shape and 400s on the first model
    # call (PayClear outage 2026-08-21..27). 0.2.124 is the earliest
    # version verified in the field. A floor bump (not just a new release)
    # is required so plain `pipx upgrade` actually replaces the frozen SDK,
    # and the <0.3 cap keeps the next major jump a deliberate, tested release
    # instead of a surprise on fresh installs.
    "claude-agent-sdk>=0.2.124,<0.3",
    "structlog",
    "click>=8.0",
    "pyjwt[crypto]>=2.12.0",
]

[project.scripts]
hiro = "hiro_agent.cli:main"

[tool.uv]
# Force the patched starlette (transitive via claude-agent-sdk -> mcp / sse-starlette).
# Fixes CVE-2026-54283, CVE-2026-48818, CVE-2026-48817, CVE-2026-54282.
# Force patched idna (transitive via claude-agent-sdk -> anyio / mcp -> httpx). Fixes CVE-2026-45409.
# Force patched python-dotenv (transitive via claude-agent-sdk -> mcp -> pydantic-settings). Fixes CVE-2026-28684.
# Force patched pydantic-settings (transitive via claude-agent-sdk -> mcp). Fixes path traversal GHSA-4xgf-cpjx-pc3j.
# Force patched mcp (transitive via claude-agent-sdk). Fixes CVE-2026-59950 / GHSA-vj7q-gjh5-988w (deprecated websocket_server missing Host/Origin validation).
# Force patched cryptography (transitive via pyjwt[crypto]). Fixes CVE-2026-69247 (observable timing discrepancy).
constraint-dependencies = ["starlette>=1.3.1", "idna>=3.15", "python-dotenv>=1.2.2", "pydantic-settings>=2.14.2", "mcp>=1.28.1", "cryptography>=50.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hiro_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
