[project]
name = "hiro-agent"
version = "0.1.11"
description = "AI security review agent for code, plans, and infrastructure"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = [
    "claude-agent-sdk>=0.1.37",
    "structlog",
    "click>=8.0",
    "pyjwt[crypto]>=2.12.0",
]

[project.scripts]
hiro = "hiro_agent.cli:main"

[tool.uv]
# Force the patched starlette (transitive via claude-agent-sdk -> mcp / sse-starlette).
# Fixes CVE-2025-62727, CVE-2026-48710, AIKIDO-2026-10923.
# Force patched idna (transitive via claude-agent-sdk -> anyio / mcp -> httpx). Fixes CVE-2026-45409.
# Force patched python-multipart (transitive via claude-agent-sdk -> mcp). Fixes python-multipart
# path traversal: CVE-2026-24486, CVE-2026-53539, CVE-2026-42561, CVE-2026-40347, CVE-2026-53540,
# CVE-2026-53538, CVE-2026-53537.
constraint-dependencies = ["starlette>=1.0.1", "idna>=3.15", "python-multipart>=0.0.31"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hiro_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
